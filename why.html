<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매출 원인 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 모든 정보가 파이프라인 — 상단 스토어 파이프 → 노선도(매출 → 채널 → 제품/방송/크리에이터 → 소재 구슬) + 원인 카드 → 소재 파이프 보드 · 라이브 파이프 · 제품 파이프 */
:root{
  --bg:#f7f7f9; --surface:#ffffff; --ink:#1d1f2e; --muted:#8a8fa3; --line:#ececf2; --soft:#f4f3fb;
  --accent:#7c6cf2; --accent-fill:#ede9fe;
  --up:#16a05d; --up-bg:#e7f6ee; --down:#e0483e; --down-bg:#fdeceb; --neutral:#b4b8c7;
  --c-live:#7c6cf2; --c-video:#4f7cf6; --c-afl:#f08a4b; --c-card:#9aa1b2; --c-sv:#22b3a3;
  --f-body:"Inter","IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Inter","IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121319; --surface:#1b1d26; --ink:#eceef5; --muted:#9499ad; --line:#2a2d3a; --soft:#23253a;
  --accent:#9d90ff; --accent-fill:#2c2850;
  --up:#3fcf8a; --up-bg:#16362a; --down:#ff7a6e; --down-bg:#3d1e1d; --neutral:#5c6175;
  --c-live:#9d90ff; --c-video:#7ea1ff; --c-afl:#ffaa73; --c-card:#a9afbf; --c-sv:#4fd1c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121319; --surface:#1b1d26; --ink:#eceef5; --muted:#9499ad; --line:#2a2d3a; --soft:#23253a;
  --accent:#9d90ff; --accent-fill:#2c2850;
  --up:#3fcf8a; --up-bg:#16362a; --down:#ff7a6e; --down-bg:#3d1e1d; --neutral:#5c6175;
  --c-live:#9d90ff; --c-video:#7ea1ff; --c-afl:#ffaa73; --c-card:#a9afbf; --c-sv:#4fd1c0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.pill.up{background:var(--up-bg);color:var(--up)} .pill.down{background:var(--down-bg);color:var(--down)} .pill.muted{background:var(--soft);color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 6px;min-width:0}
.kc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.kc .v{font-size:21px;font-weight:600;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.kc svg{display:block;width:100%;height:auto}
.ctable{overflow-x:auto}
.ctable table{border-collapse:collapse;width:100%;font-size:13px}
.ctable th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ctable td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.ctable td.n{text-align:right;font-variant-numeric:tabular-nums}
.ctable .sp{display:flex;align-items:center;gap:8px}
.ctable .sp small{display:block;font-size:11px}
.sel{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface);color:var(--ink)}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.period label{font-size:12px;color:var(--muted)}
.period input{font:inherit;font-family:var(--f-num);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);color:var(--ink)}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent);border-color:var(--accent)}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--c-video);outline-offset:2px}
.headline{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
/* HTML 파이프 (스토어·라이브·제품 공통) */
.pipe{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 0 6px}
.stop{flex:1 0 118px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative;padding:0 4px;min-width:0}
.stop::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:6px;background:var(--pc,var(--ink));opacity:.28;z-index:0}
.stop:first-child::before{display:none}
.stop .dot{width:36px;height:36px;border-radius:50%;background:var(--surface);border:5px solid var(--neutral);z-index:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.stop .dot.up{border-color:var(--up);color:var(--up)} .stop .dot.down{border-color:var(--down);color:var(--down)}
.stop .nm{font-size:12.5px;font-weight:600}
.stop .vv{font-size:12px;font-family:var(--f-num);color:var(--muted)}
.stop .cc{font-size:13px;font-family:var(--f-num);font-weight:600}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
@media (max-width:1060px){.main{grid-template-columns:1fr}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto;position:relative}
.mapbox svg{display:block;min-width:1180px;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:4px 8px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.card .crumb{font-size:12px;color:var(--muted)}
.card .big{font-family:var(--f-num);font-size:24px;font-weight:600}
.card table{width:100%;border-collapse:collapse;font-size:13px}
.card td,.card th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.card th{color:var(--muted);font-weight:500;font-size:12px}
.card td.n,.card th.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.why{font-size:13.5px;background:var(--soft);border-radius:8px;padding:8px 10px}
.act{font-size:13px;border-left:3px solid var(--c-live);padding:4px 10px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:999px;border:1px solid var(--line);margin-left:4px;white-space:nowrap}
.tag.good{border-color:var(--up);color:var(--up)} .tag.bad{border-color:var(--down);color:var(--down)} .tag.new{border-color:var(--c-video);color:var(--c-video)}
a{color:var(--c-video)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.row .lab{font-size:13px;font-weight:600;min-width:0}
.row .lab small{display:block;font-weight:400;font-family:var(--f-num);font-size:12px}
.row .lane{overflow-x:auto}
.row .lane svg{display:block}
@media (max-width:640px){.row{grid-template-columns:1fr}}
.flow{animation:flow 1.6s linear infinite}
.flow.out{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-48}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
.st{cursor:pointer}
.st:focus{outline:none}
.st:focus-visible circle,.st:focus-visible rect{stroke-width:6}
.dim{opacity:.22;transition:opacity .2s}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 8px;border-radius:6px;max-width:280px;z-index:20}
.bubble{position:absolute;max-width:290px;background:var(--ink);color:var(--surface);padding:10px 12px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:15}
.bubble .nav{display:flex;justify-content:space-between;margin-top:8px;gap:8px}
.bubble button{font:inherit;font-size:12px;border:1px solid var(--surface);background:transparent;color:var(--surface);border-radius:6px;padding:2px 8px;cursor:pointer}
.seg{display:flex;gap:6px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pcard summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.pcard summary::-webkit-details-marker{display:none}
.pcard summary h3{font-size:15px;margin:0;min-width:140px}
.pcard .kv{font-size:13px;color:var(--muted)} .pcard .kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.agebar{display:flex;gap:8px;flex-wrap:wrap}
.age{flex:1 1 150px;border-radius:10px;padding:8px 10px;background:var(--soft);min-width:0}
.age .t{font-size:12px;color:var(--muted)} .age .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.age .s{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.two h4{margin:0 0 4px;font-size:13px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td,.mini th{padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.mini th{color:var(--muted);font-weight:500;font-size:11.5px}
.mini td.n,.mini th.n{text-align:right;font-variant-numeric:tabular-nums}
.agetag{font-size:10.5px;padding:0 5px;border-radius:5px;margin-left:4px;background:var(--soft);color:var(--muted)}
.agetag.new{background:var(--accent-fill);color:var(--accent)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.row .pipe .stop{flex:0 0 150px}
.row .pipe .stop .dot{width:26px;height:26px;border-width:4px;font-size:11px}
.row .pipe .stop::before{top:10px;height:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div><div class="note">d'Alba US TikTok Shop</div><h1>매출 원인 지도</h1></div>
    <form class="period" id="pform" aria-label="기간 선택">

</div>
<div class="tip" id="tip" hidden></div>
<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const usd = v => (v < 0 ? "-$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-US");
const sd = v => v == null ? "" : (v >= 0 ? "+" : "-") + "$" + Math.abs(Math.round(v)).toLocaleString("en-US");
const pct = (o, n) => o ? (n - o) / o * 100 : null;
const spc = (o, n) => { const p = pct(o, n); return p == null ? "신규" : (p >= 0 ? "+" : "") + p.toFixed(1) + "%"; };
const cls = v => v == null || Math.abs(v) < 0.5 ? "muted" : v > 0 ? "up" : "down";
const COL = {live: "--c-live", afl: "--c-afl", video: "--c-video", card: "--c-card", sv: "--c-sv"};
const md = k => k ? (+k.slice(5, 7)) + "/" + (+k.slice(8)) : "";
const DOW = k => "일월화수목금토"[new Date(k + "T00:00:00Z").getUTCDay()];
const vlink = (cid, h) => `https://www.tiktok.com/@${h || "tiktok"}/video/${cid}`;
// 증감을 곱셈 요인별로 나누기 (합이 정확히 맞는 로그 분해)
function split(oldF, newF, oldV, newV) {

}
const SHORT = [["PRO 2X 4 Bundle","PRO 2X 4번들"],["Holiday Gift Set] White Truffle First Spray Serum PRO 2X 3 Bundle","PRO 2X 3번들 홀리데이"],["PRO2X 3 Bundle","PRO2X 3번들"],["Serum PRO 2X","PRO 2X"],["First Spray Serum Holiday Gift Set (3+2+1)","퍼스트 기프트세트"],["Tone Up Sunscreen Serum Holiday Gift Set | Tone Up Sunscreen 5EA","톤업 5번들"],["Tone Up Sunscreen Serum Holiday","톤업 홀리데이 세트"],["Authentic Face Glow Serum","퍼스트 본품"],["Age Less, Lift More","보르피린3종"],["Volufiline Plumping","볼루필린 풀세트(라이브)"],["Galvanic","갈바닉 아이크림"],["Grinding Cream","그라인딩"],["Overnight Radiance Vita Set","비타 5종"],["Affordable Vita","비타 7종(라이브)"],["Glow & Lift Routine","더블라인"],["Waterfull Tone Up Sunscreen","톤업"],["Liposome","반반패드"],["All-in-one Multi Balm","멀티밤"],["5 Solution Gift Box","5 Solution 기프트박스"],["No Cakey","No Cakey 세트(라이브)"],["Morning Radiance","Morning Radiance(라이브)"],["Night Repair","Night Repair(라이브)"],["Hair Essential Duo","헤어 듀오"],["Full Skincare Routine","풀 스킨케어 루틴"],["UV Essence","UV 에센스 선크림"],["Vita Toning Anti-Aging Spray","비타 미스트 8%"],["Double Layer Revitalizing","더블레이어 세럼"],["Double Serum & Cream","더블세럼&크림"],["Vita Toning Serum Toner","비타 토너"],["Refresh Aqua","리프레시 아쿠아"],["Cleansing Duo","클렌징 듀오"],["Daily 3 Step","비타 3단계"],["Sun Stick","선스틱"]];
const short = n => { for (const [k, v] of SHORT) if (String(n).toLowerCase().includes(k.toLowerCase())) return v; return String(n).replace(/\[[^\]]*\]\s*/g, "").split(/[|,–-]/)[0].trim().slice(0, 22); };
const TROI_MAP = {"프로투엑스": "PRO 2X", "퍼스트": "퍼스트 본품", "퍼스트 3번들": "퍼스트 기프트세트", "톤업선크림 (단품)": "톤업", "비타 5종": "비타 5종", "비타라인 5종": "비타 5종", "반반패드": "반반패드", "더블라인": "더블라인", "갈바닉 아이크림": "갈바닉 아이크림", "그라인딩크림": "그라인딩", "보르피린 3종": "보르피린3종", "멀티밤": "멀티밤"};

let D, NODES = {}, CUR = null;

function prep(raw) {
  const A = raw.periods.a, B = raw.periods.b, dA = raw.periods.days.a, dB = raw.periods.days.b;
  const norm = dA !== dB; // 길이가 다르면 일평균 비교
  const fa = norm ? 1 / dA : 1, fb = norm ? 1 / dB : 1;

  const prods = raw.products.map(p => ({id: p.id, name: short(p.name), full: p.name, a: scale(p.a, fa), b: scale(p.b, fb), ads: p.ads, live: p.live ? {a: scale(p.live.a, fa), b: scale(p.live.b, fb)} : null}));
  function scale(o, f) { const r = {}; for (const k in o) r[k] = o[k] * f; return r; }

  const cre = raw.creatives.map(c => ({...c, name: short(c.product || ""), sa: c.a.spend * fa, sb: c.b.spend * fb, ga: c.a.gmv * fa, gb: c.b.gmv * fb, label: c.creator ? "@" + c.creator : "소재 …" + c.cid.slice(-5)}))
    .map(c => ({...c, dg: c.ga - c.gb, ds: c.sa - c.sb}));

    return {h: c.h, o, n, d: n.gmv * fa - o.gmv * fb, prods: c.products, spark: c.spark};

}
// ---------------- 렌더
function render(raw) {
  D = prep(raw); NODES = {};
  const {st, A, B} = D, n = st.a, o = st.b, TOT = n.gmv - o.gmv;
  $("#periodNote").textContent = `기준 ${md(A[0])}(${DOW(A[0])})${A[1] !== A[0] ? " ~ " + md(A[1]) + "(" + DOW(A[1]) + ")" : ""} vs 비교 ${md(B[0])}(${DOW(B[0])})${B[1] !== B[0] ? " ~ " + md(B[1]) + "(" + DOW(B[1]) + ")" : ""}${D.norm ? " · 기간 길이가 달라 일평균으로 비교합니다" : ""}`;
  const chans = [
    {id: "live", name: "브랜드 라이브", key: "sl"}, {id: "afl", name: "AF 라이브", key: "cl"}, {id: "video", name: "AF 영상", key: "cv"},
    {id: "card", name: "상품카드", key: "pc"}, {id: "sv", name: "셀러 영상", key: "sv"}].map(c => ({...c, o: o[c.key], n: n[c.key], d: n[c.key] - o[c.key]})).sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
  D.chans = chans; D.TOT = TOT;

  if (opt.bands) opt.bands.forEach(([i0, i1, c]) => { if (i0 < 0 || i1 < i0) return; s += `<rect x="${x(i0) - (n > 1 ? (w / (n - 1)) / 2 : 0)}" y="0" width="${Math.max(3, x(i1) - x(i0) + (n > 1 ? w / (n - 1) : 0))}" height="${H}" fill="${c}"/>`; });
  s += `<path d="M${x(0)},${H} L${pts.join(" L")} L${x(n - 1)},${H} Z" fill="url(#${id})"/><polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;

function laneData() {

      sub.push({id: "afl-down", name: "줄어든·결석 크리에이터", kind: "creator", beads: C.filter(c => c.d < 0).slice(0, 9).map(c => ({id: "cr-" + c.h, label: "@" + c.h, d: c.d, sub: c.n.gmv ? `${usd(c.o.gmv * D.fb)}→${usd(c.n.gmv * D.fa)}` : "결석", kind: "creator", data: c}))});
    } else if (ch.id === "video") {
      for (const x of by("cv").slice(0, 5)) {
        const cs = D.cre.filter(c => c.pid === x.p.id && Math.abs(c.dg) >= 20).sort((u, v) => Math.abs(v.dg) - Math.abs(u.dg)).slice(0, 9);
        sub.push({id: "v-" + x.p.id, name: x.p.name, d: x.d, o: x.o, n: x.n, kind: "prodlane", prod: x.p, beads: cs.map(c => ({id: "c-" + c.cid + c.camp, label: c.label, d: c.dg, sub: `광고비 ${usd(c.sb)}→${usd(c.sa)}`, kind: "creative", data: c}))});

function brandFunnel() {

  if (!A.length || !B.length) return null;
  const agg = L => { const g = L.filter(x => x.handle === "dalba_global"); const t = k => g.reduce((s, x) => s + x[k], 0); return {hrs: t("minutes") / 60, impr: t("impr"), viewers: t("viewers"), clicks: t("clicks"), orders: t("orders"), gmv: t("gmv"), auction: t("auction"), date: g[0] && g[0].date}; };
  const o = agg(B), n = agg(A);

  const fo = f(o), fn = f(n);

}
