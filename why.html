<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매출 원인 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 모든 정보가 파이프라인 — 상단 스토어 파이프 → 노선도(매출 → 채널 → 제품/방송/크리에이터 → 소재 구슬) + 원인 카드 → 소재 파이프 보드 · 라이브 파이프 · 제품 파이프 */
:root{
  --bg:#f7f7f9; --surface:#ffffff; --ink:#1d1f2e; --muted:#8a8fa3; --line:#ececf2; --soft:#f4f3fb;
  --accent:#7c6cf2; --accent-fill:#ede9fe;
  --up:#16a05d; --up-bg:#e7f6ee; --down:#e0483e; --down-bg:#fdeceb; --neutral:#b4b8c7;
  --c-live:#7c6cf2; --c-video:#4f7cf6; --c-afl:#f08a4b; --c-card:#9aa1b2; --c-sv:#22b3a3;
  --f-body:"Inter","IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Inter","IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121319; --surface:#1b1d26; --ink:#eceef5; --muted:#9499ad; --line:#2a2d3a; --soft:#23253a;
  --accent:#9d90ff; --accent-fill:#2c2850;
  --up:#3fcf8a; --up-bg:#16362a; --down:#ff7a6e; --down-bg:#3d1e1d; --neutral:#5c6175;
  --c-live:#9d90ff; --c-video:#7ea1ff; --c-afl:#ffaa73; --c-card:#a9afbf; --c-sv:#4fd1c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121319; --surface:#1b1d26; --ink:#eceef5; --muted:#9499ad; --line:#2a2d3a; --soft:#23253a;
  --accent:#9d90ff; --accent-fill:#2c2850;
  --up:#3fcf8a; --up-bg:#16362a; --down:#ff7a6e; --down-bg:#3d1e1d; --neutral:#5c6175;
  --c-live:#9d90ff; --c-video:#7ea1ff; --c-afl:#ffaa73; --c-card:#a9afbf; --c-sv:#4fd1c0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.pill.up{background:var(--up-bg);color:var(--up)} .pill.down{background:var(--down-bg);color:var(--down)} .pill.muted{background:var(--soft);color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 6px;min-width:0}
.kc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.kc .v{font-size:21px;font-weight:600;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.kc svg{display:block;width:100%;height:auto}
.ctable{overflow-x:auto}
.ctable table{border-collapse:collapse;width:100%;font-size:13px}
.ctable th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ctable td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.ctable td.n{text-align:right;font-variant-numeric:tabular-nums}
.ctable .sp{display:flex;align-items:center;gap:8px}
.ctable .sp small{display:block;font-size:11px}
.sel{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface);color:var(--ink)}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.period label{font-size:12px;color:var(--muted)}
.period input{font:inherit;font-family:var(--f-num);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);color:var(--ink)}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent);border-color:var(--accent)}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--c-video);outline-offset:2px}
.headline{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
/* HTML 파이프 (스토어·라이브·제품 공통) */
.pipe{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 0 6px}
.stop{flex:1 0 118px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative;padding:0 4px;min-width:0}
.stop::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:6px;background:var(--pc,var(--ink));opacity:.28;z-index:0}
.stop:first-child::before{display:none}
.stop .dot{width:36px;height:36px;border-radius:50%;background:var(--surface);border:5px solid var(--neutral);z-index:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.stop .dot.up{border-color:var(--up);color:var(--up)} .stop .dot.down{border-color:var(--down);color:var(--down)}
.stop .nm{font-size:12.5px;font-weight:600}
.stop .vv{font-size:12px;font-family:var(--f-num);color:var(--muted)}
.stop .cc{font-size:13px;font-family:var(--f-num);font-weight:600}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.main>.card{display:none}
@media (min-width:1600px){.main{grid-template-columns:minmax(0,1fr) 360px}.main>.card{display:flex}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto;position:relative}
.mapbox svg{display:block;min-width:1180px;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:4px 8px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.card .crumb{font-size:12px;color:var(--muted)}
.card .big{font-family:var(--f-num);font-size:24px;font-weight:600}
.card table{width:100%;border-collapse:collapse;font-size:13px}
.card td,.card th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.card th{color:var(--muted);font-weight:500;font-size:12px}
.card td.n,.card th.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.why{font-size:13.5px;background:var(--soft);border-radius:8px;padding:8px 10px}
.act{font-size:13px;border-left:3px solid var(--c-live);padding:4px 10px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:999px;border:1px solid var(--line);margin-left:4px;white-space:nowrap}
.tag.good{border-color:var(--up);color:var(--up)} .tag.bad{border-color:var(--down);color:var(--down)} .tag.new{border-color:var(--c-video);color:var(--c-video)}
a{color:var(--c-video)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.row .lab{font-size:13px;font-weight:600;min-width:0}
.row .lab small{display:block;font-weight:400;font-family:var(--f-num);font-size:12px}
.row .lane{overflow-x:auto}
.row .lane svg{display:block}
@media (max-width:640px){.row{grid-template-columns:1fr}}
.flow{animation:flow 1.6s linear infinite}
.flow.out{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-48}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
.st{cursor:pointer}
.st:focus{outline:none}
.st:focus-visible circle,.st:focus-visible rect{stroke-width:6}
.dim{opacity:.22;transition:opacity .2s}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 8px;border-radius:6px;max-width:280px;z-index:20}
.bubble{position:absolute;max-width:290px;background:var(--ink);color:var(--surface);padding:10px 12px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:15}
.bubble .nav{display:flex;justify-content:space-between;margin-top:8px;gap:8px}
.bubble button{font:inherit;font-size:12px;border:1px solid var(--surface);background:transparent;color:var(--surface);border-radius:6px;padding:2px 8px;cursor:pointer}
.seg{display:flex;gap:6px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pcard summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.pcard summary::-webkit-details-marker{display:none}
.pcard summary h3{font-size:15px;margin:0;min-width:140px}
.pcard .kv{font-size:13px;color:var(--muted)} .pcard .kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.agebar{display:flex;gap:8px;flex-wrap:wrap}
.age{flex:1 1 150px;border-radius:10px;padding:8px 10px;background:var(--soft);min-width:0}
.age .t{font-size:12px;color:var(--muted)} .age .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.age .s{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:12px}
.two>div{overflow-x:auto;min-width:0}
.two h4{margin:0 0 4px;font-size:13px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td,.mini th{padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.mini th{color:var(--muted);font-weight:500;font-size:11.5px}
.mini td.n,.mini th.n{text-align:right;font-variant-numeric:tabular-nums}
.agetag{font-size:10.5px;padding:0 5px;border-radius:5px;margin-left:4px;background:var(--soft);color:var(--muted)}
.agetag.new{background:var(--accent-fill);color:var(--accent)}
.roll{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:10px}
.roll .grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.roll h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.roll ul{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.roll li{overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
section[data-panel]{display:flex;flex-direction:column;gap:12px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.row .pipe .stop{flex:0 0 150px}
.row .pipe .stop .dot{width:26px;height:26px;border-width:4px;font-size:11px}
.row .pipe .stop::before{top:10px;height:4px}
/* 파이프 연결선 위로 흐르는 점 (매출이 늘면 → 방향, 줄면 ← 방향) */
.stop::after{content:"";position:absolute;top:17px;left:-50%;right:50%;height:2px;z-index:0;
  background:repeating-linear-gradient(90deg,var(--surface) 0 4px,transparent 4px 20px);animation:pflow 1.1s linear infinite}
.stop.neg::after{animation-direction:reverse}
.stop:first-child::after{display:none}
.row .pipe .stop::after{top:11px}
@keyframes pflow{to{background-position:20px 0}}
@media (prefers-reduced-motion: reduce){.stop::after{animation:none}}
:root{--warn:#b87300} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#f0b44a}} :root[data-theme="dark"]{--warn:#f0b44a}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.guide .g{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft);display:flex;flex-direction:column;gap:3px;min-width:0}
.guide .tag{font-size:13px;font-weight:700;padding:1px 9px;margin:0;align-self:flex-start}
.guide .r{font-size:13px;font-weight:600} .guide .a{font-size:12px;color:var(--muted)}
.how{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px}
.how ol{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.say{font-size:14px}
.chip.more{align-self:center;margin-top:6px}
.dlg{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));padding:16px;max-height:calc(100vh - 48px)}
.dlg::backdrop{background:rgba(10,12,20,.4)}
.dlg .card{position:static;max-height:none;border:0;padding:0}
.lc{display:block;width:100%;height:auto;touch-action:pan-y}
.agsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:8px}
.agsum button{font:inherit;color:inherit;text-align:left;background:var(--soft);border:0;border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0;border-left:4px solid var(--neutral)}
.agsum button.up{border-left-color:var(--up)} .agsum button.down{border-left-color:var(--down)}
.agsum button:hover{outline:2px solid var(--accent)}
.agsum .n{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agsum .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.agsum .d{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.agc details>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;padding:2px 0}
.agc details[open]>summary{margin-bottom:4px}
.vidc{font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;color:var(--muted);background:var(--soft);border:0;border-radius:4px;padding:0 4px;cursor:pointer}
.vidc:hover{color:var(--accent)}
.aggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:12px;align-items:start}
.agc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.agc.live{border-color:var(--accent)}
.agc .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.agc .t h3{font-size:16px}
.agc .kpi{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.agc .kpi b{color:var(--ink);font-weight:600}
.agc .hd{font-size:15px;font-weight:600;line-height:1.5}
.agc .wy{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.agc .wy li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px}
.agc .wy .im{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.agc .wy .f{font-weight:600} .agc .wy .d{grid-column:2;color:var(--muted)}
.agc dl{margin:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.agc dl div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.agc dt{font-weight:600;color:var(--muted);font-size:12px;padding-top:1px} .agc dd{margin:0;overflow-wrap:anywhere}
.agc .ac{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:13px}
.agc .ac b{font-size:12px;color:var(--accent)}
.agc .ac ol{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.agc .wt{font-size:12.5px;color:var(--warn)}
.agc .wait{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.agc .er{color:var(--down);font-size:13px}
.agc .ft{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.agc .ft button{font:inherit;font-size:11.5px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.btn:disabled{opacity:.5;cursor:default}
.vid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);user-select:all;margin-left:4px}
.hb{display:flex;flex-direction:column;gap:6px}
.hb .r{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:13px}
.hb .r>span:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .r>span:last-child{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:12.5px}
.track{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--soft)}
.track i{display:block;height:100%;border-right:2px solid var(--surface)}
.plist{display:flex;flex-direction:column}
.plist details{border-bottom:1px solid var(--line)}
.plist summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:130px minmax(0,1fr) 210px 14px;gap:14px;align-items:center;padding:11px 4px;font-size:13.5px}
.plist summary::-webkit-details-marker{display:none}
.plist summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .15s}
.plist details[open] summary::after{transform:rotate(90deg)}
.plist summary:hover{background:var(--soft)}
.plist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .rt{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.plist .in{padding:4px 4px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plist .in>div:last-child{overflow-x:auto}
/* 광고 소재 탭: 결론 숫자 → 오늘 할 일 → 제품별 목록 */
.adk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
.adk>div{background:var(--soft);border-radius:12px;padding:12px 14px;min-width:0}
.adk .t{font-size:12.5px;color:var(--muted)}
.adk .v{font-size:clamp(20px,5.5vw,25px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.adk .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.adk .leak{background:var(--down-bg)} .adk .leak .v{color:var(--down)}
.mix{display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px;margin-top:4px}
.mix i{display:block;height:100%;min-width:3px}

    return `<button type="button" class="${v === "up" ? "up" : v === "down" ? "down" : ""}" data-agto="${a.key}"><div class="n">${esc(a.name)}</div>${m ? `<div class="v">${usd(m[1])}</div><div class="d ${cls(m[1] - m[0])}">${sd(m[1] - m[0])} (${spc(m[0], m[1])})</div>` : `<div class="d">${v === "up" ? "상승" : v === "down" ? "하락" : "보합"}</div>`}</button>`; }).join("");
  $("#agSum").querySelectorAll("[data-agto]").forEach(b => b.onclick = () => $("#agc-" + b.dataset.agto).scrollIntoView({behavior: "smooth", block: "start"}));
  $("#agGrid").querySelectorAll("[data-agre]").forEach(b => b.onclick = () => agRunOne(AGL.find(a => a.key === b.dataset.agre), true));
  const done = AGL.filter(a => AGS[a.key] && AGS[a.key].data).length, busy = AGL.filter(a => AGS[a.key] && AGS[a.key].loading).length;
  $("#agTitle").textContent = `${md(AGD)}(${DOW(AGD)}) 에이전트 데일리 리포트`;
  $("#agNote").textContent = busy ? `분석 중… ${done}/${AGL.length} 완료` : `제품 ${AGL.filter(a => a.key !== "live").length}명 + 라이브 1명이 그날을 전날·지난주 같은 요일과 비교한 분석입니다. ${done ? "위 칸을 누르면 그 제품 카드로 갑니다." : "이 날짜는 아직 분석이 올라오지 않았습니다."}${D.A[0] !== D.A[1] ? " 기간을 고르면 마지막 날 리포트를 보여줍니다." : ""} (${done}/${AGL.length})`;
  $("#agRun").disabled = $("#agRe").disabled = busy > 0; $("#agRun").hidden = $("#agRe").hidden = !AGRUN;
}
async function agRunOne(ag, force) {
  AGS[ag.key] = {loading: true}; drawAgents();
  for (let t = 0; t < 2; t++) {
    try {
      let pw = ""; try { pw = localStorage.getItem("dashPw") || ""; } catch (e) {}
      const r = await fetch(`/api/agents?a=${AGD}&agent=${ag.key}${force ? "&force=1" : ""}`, {method: "POST", headers: {"x-dash-pw": pw}});
      const j = await r.json();
      if (r.status === 401 && t === 0) {
        const p = prompt("분석 실행 비밀번호를 입력하세요 (대시보드 비밀번호)");
        if (!p) { AGS[ag.key] = {error: "비밀번호가 없어 실행하지 않았습니다"}; break; }
        try { localStorage.setItem("dashPw", p); } catch (e) {}
        continue;
      }
      AGS[ag.key] = j.error ? {error: j.error} : {data: j}; break;
    } catch (e) { AGS[ag.key] = {error: "연결 오류: " + e.message}; break; }
  }
  drawAgents();
}
async function agRunAll(force) {
  const todo = AGL.filter(a => force || !(AGS[a.key] && AGS[a.key].data));
  if (!todo.length) { $("#agNote").textContent = "이미 모두 분석했습니다. 새로 하려면 '다시 분석'을 누르세요."; return; }
  await agRunOne(todo[0], force);
  await Promise.all(todo.slice(1).map(a => agRunOne(a, force)));
}
let AGRUN = false; // 서버에 API 키가 있을 때만 화면에서 직접 실행
async function loadAgents() {
  AGD = D.A[1]; AGS = {};
  $("#agRun").onclick = () => agRunAll(false); $("#agRe").onclick = () => agRunAll(true);
  if (window.WHY_DATA) { $("#agNote").textContent = "시안에서는 에이전트 리포트를 불러올 수 없습니다. 사이트에서 확인하세요."; $("#agRun").disabled = $("#agRe").disabled = true; return; }
  try { const j = await fetch(`/api/agents?a=${AGD}`).then(r => r.json()); AGL = j.agents || []; AGRUN = !!j.canRun; for (const a of AGL) if (a.saved) AGS[a.key] = {data: a.saved}; }
  catch (e) { $("#agNote").textContent = "리포트를 불러오지 못했습니다: " + e.message; }
  drawAgents();
}
// ---------------- 투어
function tourSteps() {
  const st = [["root", `매출이 ${sd(D.TOT)} 움직였어요.`]];
  const top = D.lanes[0]; st.push(["lane-" + top.id, `가장 큰 원인은 ${top.name}(${sd(top.d)})이에요.`]);
  for (const l of D.lanes.slice(0, 3)) for (const sb of l.sub.slice(0, 1)) {
    const b = sb.beads[0];
    if (b) st.push([b.id, `${l.name} › ${sb.name}: ${b.label} ${sd(b.d)}`]);
  }
  return st.filter(([id]) => NODES[id] && $("#map").querySelector(`[data-id="${CSS.escape(id)}"]`));
}
function tour(i) {
  document.querySelectorAll(".bubble").forEach(b => b.remove());
  const T = tourSteps(); if (i < 0 || i >= T.length) { CUR = null; highlight(null); return; }
  const [id, text] = T[i]; select(id);
  const g = $("#map").querySelector(`[data-id="${CSS.escape(id)}"]`), box = $("#mapbox"), r = g.getBoundingClientRect(), rb = box.getBoundingClientRect();
  const b = document.createElement("div"); b.className = "bubble";
  b.innerHTML = `<div><b>${i + 1}/${T.length}</b> ${text}</div><div class="nav"><button type="button" data-k="p">이전</button><button type="button" data-k="e">끝내기</button><button type="button" data-k="n">${i === T.length - 1 ? "완료" : "다음"}</button></div>`;
  box.appendChild(b);
  b.style.left = Math.min(Math.max(8, r.right - rb.left + box.scrollLeft + 8), box.scrollWidth - 300) + "px"; b.style.top = Math.max(8, r.top - rb.top - 8) + "px";
  b.querySelector('[data-k="p"]').onclick = () => tour(i - 1); b.querySelector('[data-k="n"]').onclick = () => tour(i === T.length - 1 ? -1 : i + 1); b.querySelector('[data-k="e"]').onclick = () => tour(-1);
}
// ---------------- 기간 선택
function params() {
  const q = new URLSearchParams(location.search);
  const y = new Date(Date.now() - 86400000 * 2).toISOString().slice(0, 10);
  return {a: q.get("a") || y, a2: q.get("a2") || "", b: q.get("b") || "", b2: q.get("b2") || ""};
}
function fill(p) { $("#a").value = p.a; $("#a2").value = p.a2 || p.a; $("#b").value = p.b || ""; $("#b2").value = p.b2 || ""; }
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === ch));
  const a = $("#a").value, a2 = $("#a2").value || a, len = (Date.parse(a2) - Date.parse(a)) / 86400000 + 1;
  if (ch.dataset.p === "prev") { $("#b").value = addD(a, -len); $("#b2").value = addD(a, -1); }
  else { $("#b").value = addD(a, -7); $("#b2").value = addD(a2, -7); }
});
$("#pform").onsubmit = e => {
  e.preventDefault();
  const q = new URLSearchParams({a: $("#a").value}); if ($("#a2").value && $("#a2").value !== $("#a").value) q.set("a2", $("#a2").value);
  if ($("#b").value) { q.set("b", $("#b").value); q.set("b2", $("#b2").value || $("#b").value); }
  if (window.WHY_DATA) return; // 고정 데이터 시안에서는 동작하지 않음
  history.replaceState(null, "", "?" + q); load();
};
async function load() {
  const p = params(); fill(p);
  if (window.WHY_DATA) { const r = window.WHY_DATA; fill({a: r.periods.a[0], a2: r.periods.a[1], b: r.periods.b[0], b2: r.periods.b[1]}); render(r); return; }
  $("#app").innerHTML = `<div class="loading">시트에서 데이터를 불러오는 중…</div>`;
  const q = new URLSearchParams({a: p.a}); if (p.a2) q.set("a2", p.a2); if (p.b) { q.set("b", p.b); q.set("b2", p.b2 || p.b); }
  try { const r = await fetch("/api/why?" + q).then(x => x.json()); if (r.error) throw new Error(r.error); fill({a: r.periods.a[0], a2: r.periods.a[1], b: r.periods.b[0], b2: r.periods.b[1]}); render(r); }
  catch (e) { $("#app").innerHTML = `<div class="loading">데이터를 불러오지 못했습니다: ${e.message}<br>날짜가 시트에 입력돼 있는지 확인하고 다시 시도해 주세요.</div>`; }
}
const mq = matchMedia("(prefers-color-scheme: dark)");
let WIDE = innerWidth >= 700; addEventListener("resize", () => { const w = innerWidth >= 700; if (D && w !== WIDE) { WIDE = w; drawWaterfall(); } });

mq.addEventListener ? mq.addEventListener("change", redraw) : mq.addListener(redraw);
