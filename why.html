<html lang="ko">
<head>
<meta charset="utf-8">

<title>매출 원인 지도</title>

<style>
/* Layout: 모든 정보가 파이프라인 — 상단 스토어 파이프 → 노선도(매출 → 채널 → 제품/방송/크리에이터 → 소재 구슬) + 원인 카드 → 소재 파이프 보드 · 라이브 파이프 · 제품 파이프 */
:root{

  --accent:#7c6cf2; --accent-fill:#ede9fe;

  --c-live:#7c6cf2; --c-video:#4f7cf6; --c-afl:#f08a4b; --c-card:#9aa1b2; --c-sv:#22b3a3;
  --f-body:"Inter","IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Inter","IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121319; --surface:#1b1d26; --ink:#eceef5; --muted:#9499ad; --line:#2a2d3a; --soft:#23253a;
  --accent:#9d90ff; --accent-fill:#2c2850;
  --up:#3fcf8a; --up-bg:#16362a; --down:#ff7a6e; --down-bg:#3d1e1d; --neutral:#5c6175;
  --c-live:#9d90ff; --c-video:#7ea1ff; --c-afl:#ffaa73; --c-card:#a9afbf; --c-sv:#4fd1c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121319; --surface:#1b1d26; --ink:#eceef5; --muted:#9499ad; --line:#2a2d3a; --soft:#23253a;
  --accent:#9d90ff; --accent-fill:#2c2850;
  --up:#3fcf8a; --up-bg:#16362a; --down:#ff7a6e; --down-bg:#3d1e1d; --neutral:#5c6175;
  --c-live:#9d90ff; --c-video:#7ea1ff; --c-afl:#ffaa73; --c-card:#a9afbf; --c-sv:#4fd1c0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

a{color:var(--c-video)}

.seg{display:flex;gap:6px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.pcard .kv{font-size:13px;color:var(--muted)} .pcard .kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.agebar{display:flex;gap:8px;flex-wrap:wrap}
.age{flex:1 1 150px;border-radius:10px;padding:8px 10px;background:var(--soft);min-width:0}
.age .t{font-size:12px;color:var(--muted)} .age .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.age .s{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:12px}
.two>div{overflow-x:auto;min-width:0}
.two h4{margin:0 0 4px;font-size:13px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td,.mini th{padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.mini th{color:var(--muted);font-weight:500;font-size:11.5px}
.mini td.n,.mini th.n{text-align:right;font-variant-numeric:tabular-nums}
.agetag{font-size:10.5px;padding:0 5px;border-radius:5px;margin-left:4px;background:var(--soft);color:var(--muted)}
.agetag.new{background:var(--accent-fill);color:var(--accent)}
.roll{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:10px}
.roll .grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.roll h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.roll ul{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.roll li{overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
section[data-panel]{display:flex;flex-direction:column;gap:12px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.row .pipe .stop{flex:0 0 150px}
.row .pipe .stop .dot{width:26px;height:26px;border-width:4px;font-size:11px}
.row .pipe .stop::before{top:10px;height:4px}
/* 파이프 연결선 위로 흐르는 점 (매출이 늘면 → 방향, 줄면 ← 방향) */
.stop::after{content:"";position:absolute;top:17px;left:-50%;right:50%;height:2px;z-index:0;
  background:repeating-linear-gradient(90deg,var(--surface) 0 4px,transparent 4px 20px);animation:pflow 1.1s linear infinite}
.stop.neg::after{animation-direction:reverse}
.stop:first-child::after{display:none}
.row .pipe .stop::after{top:11px}
@keyframes pflow{to{background-position:20px 0}}
@media (prefers-reduced-motion: reduce){.stop::after{animation:none}}
:root{--warn:#b87300} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#f0b44a}} :root[data-theme="dark"]{--warn:#f0b44a}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.guide .g{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft);display:flex;flex-direction:column;gap:3px;min-width:0}
.guide .tag{font-size:13px;font-weight:700;padding:1px 9px;margin:0;align-self:flex-start}
.guide .r{font-size:13px;font-weight:600} .guide .a{font-size:12px;color:var(--muted)}
.how{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px}
.how ol{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.say{font-size:14px}
.chip.more{align-self:center;margin-top:6px}
.dlg{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));padding:16px;max-height:calc(100vh - 48px)}

.dlg .card{position:static;max-height:none;border:0;padding:0}
.lc{display:block;width:100%;height:auto;touch-action:pan-y}
.vid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);user-select:all;margin-left:4px}
.hb{display:flex;flex-direction:column;gap:6px}
.hb .r{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:13px}
.hb .r>span:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .r>span:last-child{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:12.5px}
.track{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--soft)}
.track i{display:block;height:100%;border-right:2px solid var(--surface)}
.plist{display:flex;flex-direction:column}
.plist details{border-bottom:1px solid var(--line)}
.plist summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:130px minmax(0,1fr) 210px 14px;gap:14px;align-items:center;padding:11px 4px;font-size:13.5px}
.plist summary::-webkit-details-marker{display:none}
.plist summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .15s}
.plist details[open] summary::after{transform:rotate(90deg)}
.plist summary:hover{background:var(--soft)}
.plist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .rt{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.plist .in{padding:4px 4px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plist .in>div:last-child{overflow-x:auto}
.mhint{display:none;font-size:12px;color:var(--muted);padding:0 8px}
@media (max-width:700px){.mhint{display:block}}
@media (max-width:700px){.plist summary{grid-template-columns:90px minmax(0,1fr) 14px}.plist .rt{grid-column:1/-1;text-align:left}}
.hb .dv{display:grid;grid-template-columns:1fr 1fr;height:16px}
.hb .dv>div{display:flex;gap:0} .hb .dv>div:first-child{justify-content:flex-end;border-right:1px solid var(--muted)}
.hb .dv i,.dv i{display:block;height:100%}
.hb button.r{font:inherit;color:inherit;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;width:100%}

.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)} .lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sbar{display:inline-block;height:8px;border-radius:2px;background:var(--c-live);vertical-align:middle;margin-right:6px}
@media (max-width:640px){.hb .r{grid-template-columns:90px minmax(0,1fr) 92px}}
</style>

<body>
<div class="wrap">
  <div class="bar">
    <div><div class="note">d'Alba US TikTok Shop · <a href="/agents.html">제품 에이전트 분석</a></div><h1>매출 원인 지도</h1></div>
    <form class="period" id="pform" aria-label="기간 선택">
      <label for="a">기준</label><input id="a" type="date"><span class="note">~</span><input id="a2" type="date">
      <label for="b">비교</label><input id="b" type="date"><span class="note">~</span><input id="b2" type="date">
      <button class="chip" type="button" data-p="prev" aria-pressed="true">전날 / 직전 같은 길이</button>
      <button class="chip" type="button" data-p="wow" aria-pressed="false">지난주 같은 요일</button>
      <button class="btn ghost" type="submit">보기</button>
    </form>
    <button class="btn" id="tourBtn" type="button">왜 올랐을까 따라가기 ▶</button>
  </div>
  <p class="note" id="periodNote"></p>
  <div id="app"><div class="loading">시트에서 데이터를 불러오는 중…</div></div>
</div>
<div class="tip" id="tip" hidden></div>
<dialog class="dlg" id="dlg" aria-label="상세"><div style="display:flex;justify-content:flex-end"><button class="chip" type="button" id="dlgX">닫기</button></div><div class="card" id="dlgBody"></div></dialog>
<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const usd = v => (v < 0 ? "-$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-US");
const sd = v => v == null ? "" : (v >= 0 ? "+" : "-") + "$" + Math.abs(Math.round(v)).toLocaleString("en-US");
const pct = (o, n) => o ? (n - o) / o * 100 : null;
const spc = (o, n) => { const p = pct(o, n); return p == null ? "신규" : (p >= 0 ? "+" : "") + p.toFixed(1) + "%"; };
const cls = v => v == null || Math.abs(v) < 0.5 ? "muted" : v > 0 ? "up" : "down";
const COL = {live: "--c-live", afl: "--c-afl", video: "--c-video", card: "--c-card", sv: "--c-sv"};
const md = k => k ? (+k.slice(5, 7)) + "/" + (+k.slice(8)) : "";
const DOW = k => "일월화수목금토"[new Date(k + "T00:00:00Z").getUTCDay()];
const vlink = (cid, h) => `https://www.tiktok.com/@${h || "tiktok"}/video/${cid}`;
const vid = c => `<span class="vid">${c.cid}</span>`;
// 증감을 곱셈 요인별로 나누기 (합이 정확히 맞는 로그 분해)
function split(oldF, newF, oldV, newV) {
  if (!(oldV > 0 && newV > 0) || oldF.some(x => !(x > 0)) || newF.some(x => !(x > 0))) return oldF.map(() => null);
  const L = oldV === newV ? oldV : (newV - oldV) / (Math.log(newV) - Math.log(oldV));

function brandFunnel() {

  if (!A.length || !B.length) return null;
  const agg = L => { const g = L.filter(x => x.handle === "dalba_global"); const t = k => g.reduce((s, x) => s + x[k], 0); return {hrs: t("minutes") / 60, impr: t("impr"), viewers: t("viewers"), clicks: t("clicks"), orders: t("orders"), gmv: t("gmv"), auction: t("auction"), date: g[0] && g[0].date}; };
  const o = agg(B), n = agg(A);
  if (!(o.impr && n.impr && o.orders && n.orders)) return null;
  const f = s => [s.hrs, s.impr / s.hrs, s.viewers / s.impr, s.clicks / s.viewers, s.orders / s.clicks, s.gmv / s.orders];
  const c = split(f(o), f(n), o.gmv, n.gmv);
  const names = ["방송 시간", "시간당 노출", "시청 진입률", "상품 클릭률", "구매 전환", "객단가"];
  const fmt = [v => v.toFixed(1) + "h", v => Math.round(v).toLocaleString(), v => (v * 100).toFixed(2) + "%", v => (v * 100).toFixed(1) + "%", v => (v * 100).toFixed(2) + "%", v => "$" + v.toFixed(2)];
  const fo = f(o), fn = f(n);
  const sameAsB = D.raw.brandLive.b.length > 0;
  return {o, n, sameAsB, title: sameAsB ? "방송 파이프" : `방송 파이프 (vs ${md(o.date)} 방송)`, steps: names.map((nm, i) => ({name: nm, v: `${fmt[i](fo[i])}→${fmt[i](fn[i])}`, c: c[i]}))};
}

function drawBoard() {

  const rows = Object.entries(byP).map(([pid, L]) => ({p: D.prods.find(p => p.id === pid) || {name: L[0].camp, id: pid}, L: L.sort((x, y) => y.dg - x.dg), net: L.reduce((s, c) => s + c.dg, 0), sp: L.reduce((s, c) => s + c.ds, 0)}))
    .sort((x, y) => Math.abs(y.net) + y.L.length * 5 - Math.abs(x.net) - x.L.length * 5).slice(0, 12);
  const maxG = Math.max(1, ...D.cre.map(c => c.ga));
  $("#board").innerHTML = rows.map((r, ri) => {
    const n = r.L.length, step = 30, W = Math.max(400, 40 + n * step), Y = 30;
    const zero = r.L.findIndex(c => c.dg < 0);

    });

    return `<div class="row"><div class="lab">${r.p.name}<small class="${cls(r.net)}">매출 ${sd(r.net)} · 광고비 ${sd(r.sp)} · ${n}개</small></div><div class="lane">${s}</div></div>`;
  }).join("") + `<p class="note">진한 구슬 = 최근 7일 포스팅된 신규 소재. 마우스를 올리면 숫자가 보입니다.</p>`;

    const up = L.filter(c => c.dg >= 5).sort((u, v) => v.dg - u.dg).slice(0, 5), dn = L.filter(c => c.dg <= -5).sort((u, v) => u.dg - v.dg).slice(0, 5);
    return {pid, name, m, t, kill, warn, bst, crs, active, d, say, up, dn};

  const mx = Math.max(1, ...items.map(x => x.t));

// ---------------- 핵심 크리에이터 TOP 50
let TCF = "all", TCP = 0;
function tcStatus(t, end) {
  const daysSincePost = t.lastPost ? Math.round((Date.parse(end) - Date.parse(t.lastPost)) / 86400000) : 999;
  const liveMain = t.live > t.video * 2;
  const slow = t.prev7 > 0 && t.last7 < t.prev7 * 0.7;
  if (liveMain) { const off = t.last7 === 0; return {daysSincePost, stop: off, slow, label: off ? ["라이브 멈춤", "bad"] : slow ? ["매출 둔화", "bad"] : ["라이브 위주", "good"]}; }
  const stop = daysSincePost > 14;
  return {daysSincePost, stop, slow, label: stop ? ["포스팅 멈춤", "bad"] : slow ? ["매출 둔화", "bad"] : t.posts7 > 0 ? ["활발", "good"] : ["보통", ""]};
}

  const pages = Math.max(1, Math.ceil(all.length / 10)); if (TCP >= pages) TCP = 0;

  $("#tcpg").querySelectorAll("[data-pg]").forEach(b => b.onclick = () => { TCP = +b.dataset.pg; drawTop50(); });
  const nStop = T.filter(t => tcStatus(t, end).stop).length, nSlow = T.filter(t => tcStatus(t, end).slow).length;
  const mx7 = Math.max(1, ...T.map(t => t.last7));
  $("#tcnote").innerHTML = `${md(dates[0])} ~ ${md(end)} AF 매출 상위 30명. 포스팅·라이브 멈춤 <b class="down">${nStop}명</b>, 매출 둔화 <b class="down">${nSlow}명</b>.`;
  $("#top50").innerHTML = `<table><tr><th>#</th><th>크리에이터</th><th class="n">30일 매출</th><th>30일 추이</th><th class="n">최근 7일 vs 이전 7일</th><th class="n">새 영상 7일 / 30일</th><th class="n">마지막 포스팅</th><th>상태</th><th>주력 제품</th></tr>${rows.map(({t, i, st}) => {

      <td>${area(t.spark, 120, 28, {fixed: true})}</td>

      <td class="n">${t.posts7} / ${t.posts30}</td>

function drawProdPipes() {

// ---------------- 투어
function tourSteps() {
  const st = [["root", `매출이 ${sd(D.TOT)} 움직였어요.`]];
  const top = D.lanes[0]; st.push(["lane-" + top.id, `가장 큰 원인은 ${top.name}(${sd(top.d)})이에요.`]);
  for (const l of D.lanes.slice(0, 3)) for (const sb of l.sub.slice(0, 1)) {
    const b = sb.beads[0];
    if (b) st.push([b.id, `${l.name} › ${sb.name}: ${b.label} ${sd(b.d)}`]);
  }
  return st.filter(([id]) => NODES[id] && $("#map").querySelector(`[data-id="${CSS.escape(id)}"]`));
}
function tour(i) {
  document.querySelectorAll(".bubble").forEach(b => b.remove());
  const T = tourSteps(); if (i < 0 || i >= T.length) { CUR = null; highlight(null); return; }
  const [id, text] = T[i]; select(id);
  const g = $("#map").querySelector(`[data-id="${CSS.escape(id)}"]`), box = $("#mapbox"), r = g.getBoundingClientRect(), rb = box.getBoundingClientRect();
  const b = document.createElement("div"); b.className = "bubble";
  b.innerHTML = `<div><b>${i + 1}/${T.length}</b> ${text}</div><div class="nav"><button type="button" data-k="p">이전</button><button type="button" data-k="e">끝내기</button><button type="button" data-k="n">${i === T.length - 1 ? "완료" : "다음"}</button></div>`;
  box.appendChild(b);
  b.style.left = Math.min(Math.max(8, r.right - rb.left + box.scrollLeft + 8), box.scrollWidth - 300) + "px"; b.style.top = Math.max(8, r.top - rb.top - 8) + "px";
  b.querySelector('[data-k="p"]').onclick = () => tour(i - 1); b.querySelector('[data-k="n"]').onclick = () => tour(i === T.length - 1 ? -1 : i + 1); b.querySelector('[data-k="e"]').onclick = () => tour(-1);
}
$("#tourBtn").onclick = () => D && tour(0);
// ---------------- 기간 선택
function params() {
  const q = new URLSearchParams(location.search);
  const y = new Date(Date.now() - 86400000 * 2).toISOString().slice(0, 10);
  return {a: q.get("a") || y, a2: q.get("a2") || "", b: q.get("b") || "", b2: q.get("b2") || ""};
}
function fill(p) { $("#a").value = p.a; $("#a2").value = p.a2 || p.a; $("#b").value = p.b || ""; $("#b2").value = p.b2 || ""; }
document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === ch));
  const a = $("#a").value, a2 = $("#a2").value || a, len = (Date.parse(a2) - Date.parse(a)) / 86400000 + 1;
  if (ch.dataset.p === "prev") { $("#b").value = addD(a, -len); $("#b2").value = addD(a, -1); }
  else { $("#b").value = addD(a, -7); $("#b2").value = addD(a2, -7); }
});
$("#pform").onsubmit = e => {
  e.preventDefault();
  const q = new URLSearchParams({a: $("#a").value}); if ($("#a2").value && $("#a2").value !== $("#a").value) q.set("a2", $("#a2").value);
  if ($("#b").value) { q.set("b", $("#b").value); q.set("b2", $("#b2").value || $("#b").value); }
  if (window.WHY_DATA) return; // 고정 데이터 시안에서는 동작하지 않음
  history.replaceState(null, "", "?" + q); load();
};
async function load() {
  const p = params(); fill(p);
  if (window.WHY_DATA) { const r = window.WHY_DATA; fill({a: r.periods.a[0], a2: r.periods.a[1], b: r.periods.b[0], b2: r.periods.b[1]}); render(r); return; }
  $("#app").innerHTML = `<div class="loading">시트에서 데이터를 불러오는 중…</div>`;
  const q = new URLSearchParams({a: p.a}); if (p.a2) q.set("a2", p.a2); if (p.b) { q.set("b", p.b); q.set("b2", p.b2 || p.b); }
  try { const r = await fetch("/api/why?" + q).then(x => x.json()); if (r.error) throw new Error(r.error); fill({a: r.periods.a[0], a2: r.periods.a[1], b: r.periods.b[0], b2: r.periods.b[1]}); render(r); }
  catch (e) { $("#app").innerHTML = `<div class="loading">데이터를 불러오지 못했습니다: ${e.message}<br>날짜가 시트에 입력돼 있는지 확인하고 다시 시도해 주세요.</div>`; }
}
const mq = matchMedia("(prefers-color-scheme: dark)");
let WIDE = innerWidth >= 700; addEventListener("resize", () => { const w = innerWidth >= 700; if (D && w !== WIDE) { WIDE = w; drawWaterfall(); } });

mq.addEventListener ? mq.addEventListener("change", redraw) : mq.addListener(redraw);
