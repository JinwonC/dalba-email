<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라이브 스케줄 보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F5F5F8; --surface:#FFFFFF; --surface-2:#EFEFF4;
    --fg:#17171F; --muted:#6E6E80; --faint:#9A9AAC;
    --line:rgba(20,20,45,.10); --line-2:rgba(20,20,45,.18);
    --live:#E11D48; --live-soft:rgba(225,29,72,.10);
    --done:#0D7D72; --done-soft:rgba(13,125,114,.12);
    --warn:#C2410C; --warn-soft:rgba(194,65,12,.12);
    --plan:#4338CA; --plan-soft:rgba(67,56,202,.10);
    --font-d:'Gothic A1','Noto Sans KR',system-ui,sans-serif;
    --font-b:'Noto Sans KR',system-ui,-apple-system,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0F0F14; --surface:#191921; --surface-2:#22222C;
      --fg:#ECECF3; --muted:#9C9CB0; --faint:#6E6E82;
      --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
      --live:#FB5C7A; --live-soft:rgba(251,92,122,.14);
      --done:#2DD4BF; --done-soft:rgba(45,212,191,.14);
      --warn:#FB923C; --warn-soft:rgba(251,146,60,.14);
      --plan:#A5B4FC; --plan-soft:rgba(165,180,252,.14);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px)}
  img{max-width:100%}
  [hidden]{display:none!important}
  .num{font-variant-numeric:tabular-nums}

  header{flex:none;background:var(--surface);border-bottom:1px solid var(--line);
    padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-family:var(--font-d);font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
  .hsub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px}
  .hstat{text-align:right;font-size:11.5px;color:var(--muted);line-height:1.35}
  .hstat b{display:block;font-family:var(--font-d);font-size:19px;color:var(--live);font-weight:800}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
  .wrap{max-width:560px;margin:0 auto}

  nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);
    background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  nav button{appearance:none;border:0;background:none;font-family:inherit;cursor:pointer;
    padding:9px 4px 10px;color:var(--faint);font-size:11px;font-weight:500;
    display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;margin-top:-1px}
  nav button .ic{font-size:17px;line-height:1}
  nav button[aria-selected="true"]{color:var(--live);border-top-color:var(--live)}

  .calbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .calbar h2{font-family:var(--font-d);font-size:16px;font-weight:700;margin:0}
  .navbtn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);
    width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .dow span{text-align:center;font-size:10.5px;color:var(--faint);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{aspect-ratio:1;border-radius:10px;background:var(--surface);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:2px;min-width:0}
  .cell.out{background:transparent;border-color:transparent;cursor:default}
  .cell.today{border-color:var(--live);border-width:1.5px}
  .cell[aria-pressed="true"]{background:var(--live);border-color:var(--live)}
  .cell[aria-pressed="true"] .d{color:#fff}
  .cell .d{font-size:13px;font-weight:500}
  .dots{display:flex;gap:2.5px;height:5px;align-items:center}
  .dots i{width:5px;height:5px;border-radius:50%;display:block}
  .dt-plan{background:var(--plan)} .dt-done{background:var(--done)} .dt-late{background:var(--warn)}

  .daylist{margin-top:16px}
  .dayhead{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px}
  .ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .who{font-weight:700;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
  .handle{font-size:11.5px;color:var(--faint);font-weight:400;margin-top:1px}
  .time{font-family:var(--font-d);font-weight:700;font-size:15px;white-space:nowrap}
  .meta{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
  .meta b{color:var(--fg);font-weight:500}
  .chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .c-plan{background:var(--plan-soft);color:var(--plan)}
  .c-live{background:var(--live-soft);color:var(--live)}
  .c-done{background:var(--done-soft);color:var(--done)}
  .c-late{background:var(--warn-soft);color:var(--warn)}
  .shot{margin-top:10px;border-radius:9px;overflow:hidden;border:1px solid var(--line);display:block}
  .shot img{display:block;width:100%}

  label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:0 0 5px}
  .field{margin-bottom:13px}
  input,select,textarea{width:100%;font-family:inherit;font-size:15px;color:var(--fg);
    background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;appearance:none}
  textarea{min-height:66px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{appearance:none;border:0;width:100%;padding:13px;border-radius:11px;cursor:pointer;
    font-family:var(--font-d);font-size:15px;font-weight:700;background:var(--live);color:#fff}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line-2)}
  .btn.sm{padding:9px 15px;font-size:13px;width:auto}

  .empty{text-align:center;padding:38px 18px;color:var(--muted)}
  .empty .big{font-family:var(--font-d);font-weight:700;color:var(--fg);font-size:15px;margin-bottom:6px}
  .empty p{margin:0;font-size:13px;line-height:1.7}
  .note{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:10px}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.55}
  h3.sec{font-family:var(--font-d);font-size:13px;font-weight:700;margin:20px 0 9px;color:var(--muted)}
  h3.sec:first-child{margin-top:0}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));
    background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;z-index:50}

  #gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:330px;max-width:100%;text-align:center}
  .gcard h2{font-family:var(--font-d);font-size:17px;margin:0 0 6px}
  .gcard p{font-size:12.5px;color:var(--muted);margin:0 0 16px}
  .gerr{color:var(--live);font-size:12px;min-height:16px;margin-bottom:6px}
</style>
</head>
<body>

<div id="gate">
  <div class="gcard">
    <h2>🔴 라이브 스케줄 보드</h2>
    <p>비밀번호를 입력하세요</p>
    <div class="gerr" id="gerr"></div>
    <input id="gpw" type="password" placeholder="비밀번호" style="margin-bottom:10px">
    <button class="btn" id="gbtn">들어가기</button>
  </div>
</div>

<header>
  <div>
    <h1>라이브 스케줄 보드</h1>
    <div class="hsub"><span class="livedot"></span>틱톡샵 어필리에잇 라이브</div>
  </div>
  <div class="hstat"><b id="statNum" class="num">–</b>보고 대기</div>
</header>

<main>
  <div class="wrap">
    <div id="err" class="banner" hidden></div>

    <section id="v-cal">
      <div class="calbar">
        <button class="navbtn" id="prevM" aria-label="이전 달">‹</button>
        <h2 id="monthLabel">—</h2>
        <button class="navbtn" id="nextM" aria-label="다음 달">›</button>
      </div>
      <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="grid" id="grid"></div>
      <div class="daylist">
        <div class="dayhead"><span id="dayLabel">날짜를 선택하세요</span><span id="dayCount"></span></div>
        <div id="dayItems"></div>
      </div>
    </section>

    <section id="v-add" hidden>
      <h3 class="sec">라이브 예정 등록</h3>
      <form id="addForm">
        <div class="field"><label for="f-name">크리에이터 이름</label><input id="f-name" required placeholder="예: Bea Phan"></div>
        <div class="field"><label for="f-handle">틱톡 핸들</label><input id="f-handle" required placeholder="@beaphan"></div>
        <div class="row2">
          <div class="field"><label for="f-date">라이브 날짜</label><input id="f-date" type="date" required></div>
          <div class="field"><label for="f-start">시작 예정</label><input id="f-start" type="time" required></div>
        </div>
        <div class="field"><label for="f-product">진행 제품 / 캠페인</label><input id="f-product" required placeholder="예: d'Alba 화이트트러플 세럼"></div>
        <div class="field"><label for="f-note">메모 (선택)</label><textarea id="f-note" placeholder="예상 진행 시간, 특이사항 등"></textarea></div>
        <button class="btn" type="submit" id="addBtn">예정 등록하기</button>
        <p class="note">등록하면 캘린더에 바로 표시되고, 라이브 당일에 종료 보고를 올릴 수 있어요.</p>
      </form>
    </section>

    <section id="v-rep" hidden><div id="repBody"></div></section>
  </div>
</main>

<nav>
  <button id="t-cal" aria-selected="true"><span class="ic">📅</span>캘린더</button>
  <button id="t-add" aria-selected="false"><span class="ic">✏️</span>예정 등록</button>
  <button id="t-rep" aria-selected="false"><span class="ic">✅</span>종료 보고</button>
</nav>

<script>
(function(){
  var LIVES=[], CUR=new Date(), SEL=null;
  var pad=function(n){return (n<10?"0":"")+n};
  var iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  var TODAY=iso(new Date());
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;
    document.body.appendChild(t);setTimeout(function(){t.remove()},2300)}
  function pw(){ try{return localStorage.getItem("dpw")||""}catch(e){return ""} }

  function api(method, body){
    return fetch("/api/lives",{method:method,cache:"no-store",
      headers:{"Content-Type":"application/json","x-board-password":pw()},
      body:body?JSON.stringify(body):undefined
    }).then(function(r){
      if(r.status===401){ showGate("비밀번호가 올바르지 않습니다."); throw new Error("unauthorized"); }
      return r.json().then(function(j){ if(!r.ok||j.error) throw new Error(j.error||"요청 실패"); return j; });
    });
  }
  function showGate(m){ document.getElementById("gerr").textContent=m||"";
    document.getElementById("gate").style.display="flex"; document.getElementById("gpw").focus(); }
  function hideGate(){ document.getElementById("gate").style.display="none"; }
  document.getElementById("gbtn").addEventListener("click",function(){
    try{ localStorage.setItem("dpw",document.getElementById("gpw").value) }catch(e){}
    hideGate(); load();
  });
  document.getElementById("gpw").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("gbtn").click() });

  function status(l){ if(l.endTime) return "done"; if(l.date<TODAY) return "late";
    if(l.date===TODAY) return "today"; return "plan" }
  var CHIP={done:["c-done","완료"],late:["c-late","보고 필요"],today:["c-live","오늘"],plan:["c-plan","예정"]};

  function load(){
    api("GET").then(function(j){
      LIVES=j.lives||[]; document.getElementById("err").hidden=true; renderAll();
    }).catch(function(e){
      if(e.message==="unauthorized") return;
      var b=document.getElementById("err"); b.hidden=false; b.textContent="불러오지 못했습니다: "+e.message;
    });
  }
  function renderAll(){ renderStat(); renderCal(); renderDay(); renderRep(); }
  function renderStat(){
    document.getElementById("statNum").textContent=LIVES.filter(function(l){return status(l)==="late"}).length;
  }
  function renderCal(){
    var y=CUR.getFullYear(), m=CUR.getMonth();
    document.getElementById("monthLabel").textContent=y+"년 "+(m+1)+"월";
    var start=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    var by={}; LIVES.forEach(function(l){(by[l.date]=by[l.date]||[]).push(l)});
    var h="",i,d;
    for(i=0;i<start;i++) h+='<div class="cell out"></div>';
    for(d=1;d<=days;d++){
      var key=y+"-"+pad(m+1)+"-"+pad(d), items=by[key]||[], kinds={};
      items.forEach(function(l){kinds[status(l)]=1});
      var dots=""; ["late","today","plan","done"].forEach(function(k){
        if(kinds[k]) dots+='<i class="dt-'+(k==="done"?"done":k==="late"?"late":"plan")+'"></i>' });
      h+='<button class="cell'+(key===TODAY?" today":"")+'" data-d="'+key+'" aria-pressed="'+(key===SEL)+'">'
       +'<span class="d num">'+d+'</span><span class="dots">'+dots+'</span></button>';
    }
    var g=document.getElementById("grid"); g.innerHTML=h;
    Array.prototype.forEach.call(g.querySelectorAll(".cell[data-d]"),function(b){
      b.addEventListener("click",function(){SEL=b.getAttribute("data-d");renderCal();renderDay()}) });
  }
  function cardHTML(l,withReport){
    var c=CHIP[status(l)];
    var h='<div class="card"><div class="ctop"><div class="who">'+esc(l.creator)
      +'<div class="handle">'+esc(l.handle)+'</div></div><div style="text-align:right">'
      +'<div class="time num">'+esc(l.startTime)+(l.endTime?' <span style="color:var(--muted)">→ '+esc(l.endTime)+'</span>':'')+'</div>'
      +'<span class="chip '+c[0]+'" style="margin-top:5px">'+c[1]+'</span></div></div>'
      +'<div class="meta"><span><b>'+esc(l.product)+'</b></span>'+(l.note?'<span>'+esc(l.note)+'</span>':'')
      +(l.reportNote?'<span>'+esc(l.reportNote)+'</span>':'')+'</div>';
    if(l.shotUrl) h+='<a class="shot" href="'+esc(l.shotUrl)+'" target="_blank" rel="noopener"><img src="'+esc(l.shotUrl)+'" alt="라이브 종료 스크린샷"></a>';
    if(withReport && !l.endTime) h+='<div style="margin-top:11px"><button class="btn sm" data-rep="'+esc(l.id)+'">종료 보고하기</button></div>';
    return h+'</div>';
  }
  function renderDay(){
    var lbl=document.getElementById("dayLabel"), box=document.getElementById("dayItems"), cnt=document.getElementById("dayCount");
    if(!SEL){ lbl.textContent="날짜를 선택하세요"; cnt.textContent=""; box.innerHTML=""; return }
    var p=SEL.split("-");
    lbl.textContent=(+p[1])+"월 "+(+p[2])+"일"+(SEL===TODAY?" (오늘)":"");
    var items=LIVES.filter(function(l){return l.date===SEL}).sort(function(a,b){return a.startTime<b.startTime?-1:1});
    cnt.textContent=items.length?items.length+"건":"";
    box.innerHTML=items.length?items.map(function(l){return cardHTML(l,false)}).join("")
      :'<div class="empty"><p>이 날 등록된 라이브가 없어요.</p></div>';
  }
  function renderRep(){
    var box=document.getElementById("repBody");
    if(!LIVES.length){
      box.innerHTML='<div class="empty"><div class="big">아직 등록된 라이브가 없어요</div>'
        +'<p>먼저 <b>예정 등록</b> 탭에서 일정을 올리면,<br>여기에서 종료 시각과 스크린샷을 보고할 수 있어요.</p></div>'; return;
    }
    var rank={late:0,today:1,plan:2,done:3};
    var list=LIVES.slice().sort(function(a,b){
      var ra=rank[status(a)],rb=rank[status(b)]; if(ra!==rb) return ra-rb; return a.date<b.date?1:-1 });
    var need=list.filter(function(l){return !l.endTime && l.date<=TODAY});
    var rest=list.filter(function(l){return need.indexOf(l)<0});
    var h="";
    if(need.length) h+='<h3 class="sec">보고 대기 '+need.length+'건</h3>'+need.map(function(l){return cardHTML(l,true)}).join("");
    if(rest.length) h+='<h3 class="sec">'+(need.length?"그 외":"전체")+'</h3>'+rest.map(function(l){return cardHTML(l,true)}).join("");
    box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll("[data-rep]"),function(b){
      b.addEventListener("click",function(){openReport(b.getAttribute("data-rep"))}) });
  }
  function openReport(id){
    var l=LIVES.filter(function(x){return x.id===id})[0]; if(!l) return;
    var now=new Date();
    document.getElementById("repBody").innerHTML='<h3 class="sec">종료 보고 — '+esc(l.creator)+'</h3>'
      +'<div class="card"><div class="meta"><span><b>'+esc(l.product)+'</b></span><span>'+esc(l.date)+' '+esc(l.startTime)+' 시작 예정</span></div></div>'
      +'<form id="repForm" style="margin-top:14px">'
      +'<div class="row2">'
      +'<div class="field"><label for="r-start">실제 시작</label><input id="r-start" type="time" value="'+esc(l.startTime)+'" required></div>'
      +'<div class="field"><label for="r-end">종료 시각</label><input id="r-end" type="time" value="'+pad(now.getHours())+':'+pad(now.getMinutes())+'" required></div></div>'
      +'<div class="field"><label for="r-shot">종료 화면 스크린샷</label><input id="r-shot" type="file" accept="image/*"></div>'
      +'<div class="field"><label for="r-memo">특이사항 (선택)</label><textarea id="r-memo" placeholder="시청자 수, 판매 건수, 이슈 등"></textarea></div>'
      +'<button class="btn" type="submit" id="repBtn">보고 제출</button>'
      +'<button class="btn ghost" type="button" id="repCancel" style="margin-top:8px">취소</button></form>';
    document.getElementById("repCancel").addEventListener("click",renderRep);
    document.getElementById("repForm").addEventListener("submit",function(e){ e.preventDefault(); submitReport(l) });
  }
  // 업로드 전 리사이즈 (긴 변 1280px, JPEG 0.8)
  function shrink(file){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){ var img=new Image();
        img.onload=function(){
          var max=1280, w=img.width, h=img.height, s=Math.min(1,max/Math.max(w,h));
          var c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
          c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL("image/jpeg",0.8));
        };
        img.onerror=function(){rej(new Error("이미지를 읽지 못했어요"))}; img.src=fr.result;
      };
      fr.onerror=function(){rej(new Error("파일을 읽지 못했어요"))}; fr.readAsDataURL(file);
    });
  }
  function submitReport(l){
    var btn=document.getElementById("repBtn"); btn.disabled=true; btn.textContent="제출 중…";
    var body={id:l.id, actualStart:document.getElementById("r-start").value,
      endTime:document.getElementById("r-end").value,
      reportNote:document.getElementById("r-memo").value.trim()};
    var f=document.getElementById("r-shot"), file=f&&f.files&&f.files[0];
    var pre = file ? shrink(file).then(function(d){ body.shotData=d }).catch(function(){ toast("스크린샷을 읽지 못해 시각만 저장해요") }) : Promise.resolve();
    pre.then(function(){ return api("PATCH", body) })
      .then(function(){ toast("보고 완료"); return api("GET") })
      .then(function(j){ LIVES=j.lives||[]; renderAll(); })
      .catch(function(e){ btn.disabled=false; btn.textContent="보고 제출";
        if(e.message!=="unauthorized") toast("저장 실패: "+e.message) });
  }
  document.getElementById("addForm").addEventListener("submit",function(e){
    e.preventDefault();
    var b=document.getElementById("addBtn"); b.disabled=true; b.textContent="등록 중…";
    var rec={creator:document.getElementById("f-name").value.trim(),
      handle:document.getElementById("f-handle").value.trim(),
      date:document.getElementById("f-date").value,
      startTime:document.getElementById("f-start").value,
      product:document.getElementById("f-product").value.trim(),
      note:document.getElementById("f-note").value.trim()};
    api("POST",rec).then(function(){
      toast("등록 완료"); e.target.reset(); document.getElementById("f-date").value=TODAY;
      SEL=rec.date; CUR=new Date(rec.date+"T00:00:00"); setView("cal"); return api("GET");
    }).then(function(j){ LIVES=j.lives||[]; renderAll() })
      .catch(function(err){ if(err.message!=="unauthorized") toast("등록 실패: "+err.message) })
      .then(function(){ b.disabled=false; b.textContent="예정 등록하기" });
  });
  function setView(v){
    [["cal","v-cal","t-cal"],["add","v-add","t-add"],["rep","v-rep","t-rep"]].forEach(function(t){
      document.getElementById(t[1]).hidden=(v!==t[0]);
      document.getElementById(t[2]).setAttribute("aria-selected", v===t[0]?"true":"false") });
    document.querySelector("main").scrollTop=0;
    if(v==="cal"){renderCal();renderDay()} if(v==="rep") renderRep();
  }
  document.getElementById("t-cal").addEventListener("click",function(){setView("cal")});
  document.getElementById("t-add").addEventListener("click",function(){setView("add")});
  document.getElementById("t-rep").addEventListener("click",function(){setView("rep")});
  document.getElementById("prevM").addEventListener("click",function(){CUR.setMonth(CUR.getMonth()-1);renderCal()});
  document.getElementById("nextM").addEventListener("click",function(){CUR.setMonth(CUR.getMonth()+1);renderCal()});

  document.getElementById("f-date").value=TODAY; SEL=TODAY;
  renderCal(); renderDay(); renderRep();
  if(pw()) load(); else showGate();
})();
</script>
</body>
</html>
