<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>d'Alba Live Ops</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
  /* d'Alba - champagne gold on cream, deep espresso text */
  :root{
    --bg:#FFFBF0; --surface:#FFFFFF; --surface-2:#FAF3E2;
    --fg:#1C1400; --muted:#7A6A40; --faint:#A79768;
    --line:rgba(140,104,0,.16); --line-2:rgba(140,104,0,.30);
    --gold:#B8860B; --gold-2:#D4A017; --gold-soft:rgba(212,160,23,.16);
    --champagne:#F4D991;
    --ok:#4A7C59; --ok-soft:rgba(74,124,89,.14);
    --alert:#A8442A; --alert-soft:rgba(168,68,42,.13);
    --font-d:'Playfair Display',Georgia,serif;
    --font-b:'Noto Sans',system-ui,-apple-system,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14110A; --surface:#1E1A10; --surface-2:#282214;
      --fg:#F4EEDD; --muted:#B8A87C; --faint:#8A7B54;
      --line:rgba(244,217,145,.14); --line-2:rgba(244,217,145,.26);
      --gold:#E3BC5A; --gold-2:#F0CB70; --gold-soft:rgba(240,203,112,.16);
      --champagne:#F4D991;
      --ok:#7FB08D; --ok-soft:rgba(127,176,141,.16);
      --alert:#E08060; --alert-soft:rgba(224,128,96,.16);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;
    line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
  img{max-width:100%} [hidden]{display:none!important}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-family:var(--font-d);font-size:23px;font-weight:700;margin:0;letter-spacing:-.01em}
  .hsub{font-size:12px;color:var(--muted);margin-top:3px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold-2);margin-right:6px;vertical-align:1px}
  .hact{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .lnk{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line-2);
    background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
  .lnk:hover{background:var(--surface-2)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .n{font-family:var(--font-d);font-size:26px;font-weight:700;line-height:1.1}
  .kpi .l{font-size:11.5px;color:var(--muted);margin-top:4px}
  .kpi.g .n{color:var(--gold)} .kpi.o .n{color:var(--ok)} .kpi.a .n{color:var(--alert)}

  h2.sec{font-family:var(--font-d);font-size:16px;font-weight:600;color:var(--fg);margin:0 0 10px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:26px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:600px}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
     background:var(--surface-2);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  td.r,th.r{text-align:right}
  .cname{font-weight:600} .chandle{font-size:11.5px;color:var(--faint)}
  .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:70px;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:99px}

  .chip{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;
    border-radius:999px;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
  .c-plan{background:var(--gold-soft);color:var(--gold)}
  .c-live{background:var(--champagne);color:#6B5000}
  .c-done{background:var(--ok-soft);color:var(--ok)}
  .c-late{background:var(--alert-soft);color:var(--alert)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
  .tab{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:6px 14px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--gold);color:#FFFBF0;border-color:var(--gold)}
  select,input[type=search]{font-family:inherit;font-size:13px;color:var(--fg);background:var(--surface);
    border:1px solid var(--line-2);border-radius:8px;padding:7px 10px}
  .grow{flex:1;min-width:140px}

  .thumb{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
  .noshot{font-size:11px;color:var(--faint)}
  .empty{text-align:center;padding:42px 18px;color:var(--muted)}
  .empty .big{font-family:var(--font-d);font-weight:600;color:var(--fg);font-size:16px;margin-bottom:6px}
  .banner{background:var(--alert-soft);color:var(--alert);border-radius:9px;padding:11px 13px;font-size:12.5px;margin-bottom:16px;line-height:1.55}
  .btn{appearance:none;border:0;padding:12px;border-radius:10px;cursor:pointer;width:100%;
    font-family:var(--font-b);font-size:15px;font-weight:600;background:var(--gold);color:#FFFBF0}

  #gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 26px;width:340px;max-width:100%;text-align:center}
  .gcard .mark{font-family:var(--font-d);font-size:22px;font-weight:700;margin-bottom:3px}
  .gcard p{font-size:12.5px;color:var(--muted);margin:0 0 17px}
  .gcard input{width:100%;font-family:inherit;font-size:15px;color:var(--fg);background:var(--surface);
    border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;margin-bottom:9px;text-align:center}
  .gerr{color:var(--alert);font-size:12px;min-height:17px;margin-bottom:5px}

  @media (max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>

<div id="gate">
  <div class="gcard">
    <div class="mark">d'Alba</div>
    <p>Live Ops &middot; admin accounts only</p>
    <div class="gerr" id="gerr"></div>
    <input id="gid" placeholder="Username" autocapitalize="off" autocomplete="username">
    <input id="gpw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="gbtn">Sign in</button>
  </div>
</div>

<div class="wrap">
  <header>
    <div>
      <h1>Live Ops</h1>
      <div class="hsub" id="meLine"><span class="dot"></span>d'Alba TikTok Shop</div>
    </div>
    <div class="hact">
      <a class="lnk" href="/live.html">Creator view</a>
      <a class="lnk" id="csvBtn">Download CSV</a>
      <a class="lnk" id="reload">Refresh</a>
      <a class="lnk" id="logout">Sign out</a>
    </div>
  </header>

  <div id="err" class="banner" hidden></div>
  <div class="kpis" id="kpis"></div>

  <h2 class="sec">By creator</h2>
  <div class="panel"><div class="scroll"><table id="byCreator">
    <thead><tr><th>Creator</th><th class="r">Scheduled</th><th class="r">Wrapped</th>
      <th class="r">Open</th><th class="r">Air time</th><th style="width:140px">Wrap rate</th></tr></thead>
    <tbody></tbody></table></div></div>

  <h2 class="sec">All lives</h2>
  <div class="filters">
    <button class="tab" data-f="all" aria-selected="true">All</button>
    <button class="tab" data-f="late" aria-selected="false">Needs wrap-up</button>
    <button class="tab" data-f="plan" aria-selected="false">Upcoming</button>
    <button class="tab" data-f="done" aria-selected="false">Wrapped</button>
    <select id="whoSel"><option value="">All creators</option></select>
    <input type="search" id="q" class="grow" placeholder="Search name, handle or notes">
  </div>
  <div class="panel"><div class="scroll"><table id="rows">
    <thead><tr><th>Date</th><th>Creator</th><th>Time</th><th class="r">Duration</th>
      <th>Status</th><th>Notes</th><th>Screenshot</th></tr></thead>
    <tbody></tbody></table></div></div>
</div>

<script>
(function(){
  var LIVES=[], ME=null, FILTER="all";
  var DEFTZ="America/New_York";
  var pad=function(n){return (n<10?"0":"")+n};
  var iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  var TODAY=iso(new Date());
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  function cred(k){ try{return localStorage.getItem(k)||""}catch(e){return ""} }
  function setCred(i,p){ try{localStorage.setItem("lb_id",i);localStorage.setItem("lb_pw",p)}catch(e){} }

  function tzAbbr(tz,dateStr){
    try{
      var d=new Date((dateStr||TODAY)+"T12:00:00Z");
      var p=new Intl.DateTimeFormat("en-US",{timeZone:tz||DEFTZ,timeZoneName:"short"}).formatToParts(d);
      var n=p.filter(function(x){return x.type==="timeZoneName"})[0];
      return n?n.value:"";
    }catch(e){ return "" }
  }
  function t12(hhmm){
    if(!hhmm) return "";
    var p=hhmm.split(":"),h=+p[0],m=p[1],s=h<12?"AM":"PM",hh=h%12; if(!hh) hh=12;
    return hh+":"+m+" "+s;
  }
  function api(method, body){
    return fetch("/api/lives",{method:method,cache:"no-store",
      headers:{"Content-Type":"application/json","x-live-id":cred("lb_id"),"x-live-pw":cred("lb_pw")},
      body:body?JSON.stringify(body):undefined
    }).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(r.status===401){ var e=new Error(j.error||"Please sign in."); e.auth=1; throw e }
        if(!r.ok||j.error) throw new Error(j.error||"Request failed");
        return j;
      });
    });
  }
  function showGate(m){ document.getElementById("gerr").textContent=m||"";
    document.getElementById("gate").style.display="flex";
    document.getElementById("gid").value=cred("lb_id");
    (cred("lb_id")?document.getElementById("gpw"):document.getElementById("gid")).focus() }
  function hideGate(){ document.getElementById("gate").style.display="none" }

  document.getElementById("gbtn").addEventListener("click",function(){
    var i=document.getElementById("gid").value.trim(), p=document.getElementById("gpw").value;
    if(!i||!p){ document.getElementById("gerr").textContent="Enter your username and password."; return }
    setCred(i,p); var b=this; b.disabled=true; b.textContent="Checking...";
    api("POST",{action:"login"}).then(function(j){
      if(!j.me||!j.me.admin){ document.getElementById("gerr").textContent="This page is for admin accounts only."; return }
      ME=j.me; hideGate(); load();
    }).catch(function(e){ document.getElementById("gerr").textContent=e.message })
      .then(function(){ b.disabled=false; b.textContent="Sign in" });
  });
  document.getElementById("gpw").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("gbtn").click() });
  document.getElementById("logout").addEventListener("click",function(){
    try{localStorage.removeItem("lb_pw")}catch(x){} ME=null; LIVES=[]; showGate("") });
  document.getElementById("reload").addEventListener("click",function(){ load() });

  function status(l){ if(l.endTime) return "done"; if(l.date<TODAY) return "late";
    if(l.date===TODAY) return "today"; return "plan" }
  var CHIP={done:["c-done","Wrapped"],late:["c-late","Needs wrap-up"],
            today:["c-live","Today"],plan:["c-plan","Upcoming"]};
  function minutes(l){
    if(!l.endTime) return 0;
    var s=(l.actualStart||l.startTime).split(":"), e=l.endTime.split(":");
    var a=(+s[0])*60+(+s[1]), b=(+e[0])*60+(+e[1]);
    if(b<a) b+=1440;
    return b-a;
  }
  function hm(m){ if(!m) return "-"; var h=Math.floor(m/60), r=m%60;
    return (h?h+"h ":"")+(r?r+"m":(h?"":"0m")) }

  function load(){
    api("GET").then(function(j){
      LIVES=j.lives||[]; ME=j.me||ME;
      if(!ME||!ME.admin){ showGate("This page is for admin accounts only."); return }
      document.getElementById("meLine").innerHTML='<span class="dot"></span>'+esc(ME.name)+' &middot; admin';
      document.getElementById("err").hidden=true;
      fillWho(); render();
    }).catch(function(e){
      if(e.auth){ showGate(e.message); return }
      var b=document.getElementById("err"); b.hidden=false; b.textContent="Couldn't load: "+e.message;
    });
  }
  function fillWho(){
    var sel=document.getElementById("whoSel"), cur=sel.value, seen={}, out='<option value="">All creators</option>';
    LIVES.forEach(function(l){ if(!seen[l.ownerId]){ seen[l.ownerId]=1;
      out+='<option value="'+esc(l.ownerId)+'">'+esc(l.creator)+'</option>' } });
    sel.innerHTML=out; sel.value=cur;
  }
  function render(){ renderKpis(); renderByCreator(); renderRows() }

  function kpi(n,l,cls){ return '<div class="kpi '+cls+'"><div class="n num">'+n+'</div><div class="l">'+l+'</div></div>' }
  function renderKpis(){
    var done=LIVES.filter(function(l){return status(l)==="done"});
    var late=LIVES.filter(function(l){return status(l)==="late"});
    var mins=done.reduce(function(a,l){return a+minutes(l)},0);
    document.getElementById("kpis").innerHTML=
      kpi(LIVES.length,"Lives scheduled","g")+kpi(done.length,"Wrapped up","o")
     +kpi(late.length,"Needs wrap-up","a")+kpi(hm(mins),"Total air time","g");
  }
  function renderByCreator(){
    var by={};
    LIVES.forEach(function(l){
      var k=l.ownerId||l.creator;
      var o=by[k]||(by[k]={name:l.creator,handle:l.handle,total:0,done:0,late:0,mins:0});
      o.total++; var s=status(l);
      if(s==="done"){o.done++;o.mins+=minutes(l)} if(s==="late") o.late++;
    });
    var arr=Object.keys(by).map(function(k){return by[k]})
      .sort(function(a,b){ return b.late-a.late || b.total-a.total });
    var tb=document.querySelector("#byCreator tbody");
    if(!arr.length){ tb.innerHTML='<tr><td colspan="6"><div class="empty">No lives scheduled yet.</div></td></tr>'; return }
    tb.innerHTML=arr.map(function(o){
      var pct=o.total?Math.round(o.done/o.total*100):0;
      return '<tr><td><div class="cname">'+esc(o.name)+'</div><div class="chandle">'+esc(o.handle||"")+'</div></td>'
       +'<td class="r num">'+o.total+'</td><td class="r num" style="color:var(--ok)">'+o.done+'</td>'
       +'<td class="r num" style="color:'+(o.late?"var(--alert)":"var(--faint)")+'">'+o.late+'</td>'
       +'<td class="r num">'+hm(o.mins)+'</td>'
       +'<td><div class="num" style="font-size:12px">'+pct+'%</div>'
       +'<div class="bar"><i style="width:'+pct+'%"></i></div></td></tr>';
    }).join("");
  }
  function visible(){
    var who=document.getElementById("whoSel").value;
    var q=document.getElementById("q").value.trim().toLowerCase();
    return LIVES.filter(function(l){
      var s=status(l);
      if(FILTER==="late" && s!=="late") return false;
      if(FILTER==="done" && s!=="done") return false;
      if(FILTER==="plan" && !(s==="plan"||s==="today")) return false;
      if(who && l.ownerId!==who) return false;
      if(q){ var hay=((l.creator||"")+" "+(l.handle||"")+" "+(l.note||"")+" "+(l.reportNote||"")).toLowerCase();
        if(hay.indexOf(q)<0) return false }
      return true;
    }).sort(function(a,b){ return (a.date+a.startTime) < (b.date+b.startTime) ? 1 : -1 });
  }
  function renderRows(){
    var list=visible(), tb=document.querySelector("#rows tbody");
    if(!list.length){ tb.innerHTML='<tr><td colspan="7"><div class="empty"><div class="big">Nothing matches those filters</div></div></td></tr>'; return }
    tb.innerHTML=list.map(function(l){
      var c=CHIP[status(l)], m=minutes(l), ab=tzAbbr(l.tz,l.date);
      return '<tr><td class="num" style="white-space:nowrap">'
         +esc(new Date(l.date+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}))+'</td>'
       +'<td><div class="cname">'+esc(l.creator)+'</div><div class="chandle">'+esc(l.handle||"")+'</div></td>'
       +'<td class="num" style="white-space:nowrap">'+esc(t12(l.actualStart||l.startTime))
         +(l.endTime?' - '+esc(t12(l.endTime)):'')+' <span style="color:var(--faint);font-size:11px">'+esc(ab)+'</span></td>'
       +'<td class="r num">'+(m?hm(m):'-')+'</td>'
       +'<td><span class="chip '+c[0]+'">'+c[1]+'</span></td>'
       +'<td style="min-width:160px;color:var(--muted);font-size:12.5px">'
         +esc([l.note,l.reportNote].filter(Boolean).join(" · "))+'</td>'
       +'<td>'+(l.shotSrc?'<a href="'+esc(l.shotSrc)+'" target="_blank" rel="noopener"><img class="thumb" src="'+esc(l.shotSrc)+'" alt="Screenshot"></a>':'<span class="noshot">-</span>')+'</td></tr>';
    }).join("");
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.addEventListener("click",function(){
      FILTER=b.getAttribute("data-f");
      Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){
        x.setAttribute("aria-selected", x===b?"true":"false") });
      renderRows();
    });
  });
  document.getElementById("whoSel").addEventListener("change",renderRows);
  document.getElementById("q").addEventListener("input",renderRows);

  document.getElementById("csvBtn").addEventListener("click",function(){
    var rows=[["Date","Creator","Handle","Time zone","Planned start","Actual start","End","Minutes","Status","Notes","Wrap notes"]];
    visible().forEach(function(l){
      rows.push([l.date,l.creator,l.handle||"",l.tz||"",l.startTime,l.actualStart||"",l.endTime||"",
        minutes(l)||"",CHIP[status(l)][1],l.note||"",l.reportNote||""]);
    });
    var csv="﻿"+rows.map(function(r){return r.map(function(c){
      return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    a.download="dalba-live-ops_"+TODAY+".csv"; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
  });

  if(cred("lb_id")&&cred("lb_pw")) load(); else showGate();
})();
</script>
</body>
</html>
